[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:weather_server]
command=python /app/mcp_servers/weather_server.py
directory=/app
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:attraction_server]
command=python /app/mcp_servers/attraction_server.py
directory=/app
autostart=true
autorestart=true
priority=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:llm_server]
command=python /app/mcp_servers/llm_server.py
directory=/app
autostart=true
autorestart=true
priority=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:weather_agent]
command=uvicorn main:app --host 0.0.0.0 --port 8001
directory=/app/agents/weather_agent
autostart=true
autorestart=true
priority=4
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:attraction_agent]
command=uvicorn main:app --host 0.0.0.0 --port 8002
directory=/app/agents/attraction_agent
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:itinerary_agent]
command=uvicorn main:app --host 0.0.0.0 --port 8003
directory=/app/agents/itinerary_agent
autostart=true
autorestart=true
priority=6
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:orchestrator]
command=uvicorn main:app --host 0.0.0.0 --port 8000
directory=/app/orchestrator
autostart=true
autorestart=true
priority=7
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Frontend is served by the orchestrator (FastAPI StaticFiles)
# No separate UI process needed.

